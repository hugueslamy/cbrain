name: cbrain

# CBRAIN development environment. Installation and usage: docker/README.md.
#
# Choose ONE setup: keep its line uncommented, comment the other one.
# To switch on an installed environment: 'docker compose down' first
# (without -v: the data are kept), edit, then 'docker compose up -d'.
#
#   unix  : portal + one Bourreau that runs the tasks itself (Apptainer)
#   slurm : the same, plus an emulated HPC: the Bourreau is a login node
#           that submits the tasks to Slurm (docker/slurm/README.md)

include:
  - docker-compose.unix.yml
# - path: [docker-compose.unix.yml, docker-compose.slurm.yml]
