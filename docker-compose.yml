name: cbrain

# The whole repository is mounted at /cbrain in both Rails containers:
# the Bourreau's models and plugins are symlinks into ../BrainPortal.
#
# Before the first 'up', create the CBRAIN SSH key pair (see docker/ssh/README.md).

# 1. Create the key. This has to happen before up, or Docker creates empty directories where the key files should be:
# ssh-keygen -t ed25519 -N '' -C CBRAIN_Portal_Key -f docker/ssh/id_cbrain_ed25519
# 2. Run docker compose build, then docker compose up -d.
# 3. Check the connection without a password:
# docker compose exec web ssh -i /home/cbrain/.ssh/id_cbrain_ed25519 cbrain@bourreau 'ruby -v; bundle -v'
# 4. In the portal, go to Servers → Create New Server:
#    - Name: hugues_bourreau
#    - Hostname: bourreau
#    - Username: cbrain
#    - Port: 22
#    - Rails Server Directory: /cbrain/Bourreau
#    - Data Provider caches: /home/cbrain/data/cache
#    - Shared work directory: /home/cbrain/data/work
#    - Type of cluster: UNIX
#    - Workers: 1, every 10 s


services:
  db:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-cbrain_root_pw}
      MARIADB_DATABASE: ${CBRAIN_DB_NAME:-cbrain_dev}
      MARIADB_USER: ${CBRAIN_DB_USER:-cbrain}
      MARIADB_PASSWORD: ${CBRAIN_DB_PASSWORD:-cbrain_pw}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db_data:/var/lib/mysql
    # No published port: only the portal and Adminer reach the DB
    networks:
      - db_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ./BrainPortal
      dockerfile: Dockerfile
      args:
        RUBY_VERSION: 4.0.9
        CBRAIN_UID: ${CBRAIN_UID:-1000}
        CBRAIN_GID: ${CBRAIN_GID:-1000}
    # Fixed hostname: CBRAIN names its SSH agent files after the host
    hostname: portal
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: development
      DATABASE_URL: mysql2://cbrain:cbrain_pw@db:3306/cbrain_dev
      DB_HOST: db
      DB_NAME: ${CBRAIN_DB_NAME:-cbrain_dev}
      DB_USER: ${CBRAIN_DB_USER:-cbrain}
      DB_PASSWORD: ${CBRAIN_DB_PASSWORD:-cbrain_pw}
      CBRAIN_RAILS_APP_NAME: hugues_test
    volumes:
      - .:/cbrain
      # ~/.ssh as a volume so known_hosts survives container rebuilds. A
      # bind-mounted file would not work: ssh rewrites known_hosts by
      # renaming a new file over it.
      - portal_ssh:/home/cbrain/.ssh
      # CBRAIN identity used to SSH to the Bourreau; mounted so it survives
      # container rebuilds (otherwise the portal generates a new one at boot)
      - ./docker/ssh/id_cbrain_ed25519:/home/cbrain/.ssh/id_cbrain_ed25519:ro
      - ./docker/ssh/id_cbrain_ed25519.pub:/home/cbrain/.ssh/id_cbrain_ed25519.pub:ro
      # Data Provider cache: set "Path to Data Provider caches" of the
      # portal server record to /home/cbrain/data/cache
      - portal_data:/home/cbrain/data
    networks:
      - db_net
      - cbrain_net
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true

  # The Bourreau Rails app is NOT started by this container: the portal
  # connects with SSH and starts it with script/cbrain_remote_ctl.
  # This container only provides sshd, Ruby and the gems.
  #
  # Server form in the portal:
  #   Name: hugues_bourreau   Hostname: bourreau   Username: cbrain   Port: 22
  #   Rails Server Directory:       /cbrain/Bourreau
  #   Path to Data Provider caches: /home/cbrain/data/cache
  #   Path to shared work directory:/home/cbrain/data/work
  #   Type of cluster:              UNIX
  bourreau:
    build:
      context: ./Bourreau
      dockerfile: Dockerfile
      args:
        RUBY_VERSION: 4.0.9
        CBRAIN_UID: ${CBRAIN_UID:-1000}
        CBRAIN_GID: ${CBRAIN_GID:-1000}
    hostname: bourreau
    restart: unless-stopped
    # Like on a cluster, the Bourreau has no route to the DB: it gets it
    # through the portal's reverse SSH tunnel (tmp/sockets/db.*.sock).
    networks:
      - cbrain_net
    environment:
      # Docker env is not seen by SSH sessions: the entrypoint copies these
      # into ~/.cbrain_docker_env, which ~/.bashrc sources.
      RAILS_ENV: development
      CBRAIN_RAILS_APP_NAME: hugues_bourreau
    volumes:
      - .:/cbrain
      - ./docker/ssh/id_cbrain_ed25519.pub:/run/cbrain/portal_key.pub:ro
      # sshd host keys, kept across rebuilds so they match the portal's
      # known_hosts. CBRAIN uses StrictHostKeyChecking=no: on a changed host
      # key, ssh still connects but disables forwarding, and the tunnels fail.
      - bourreau_hostkeys:/etc/ssh/hostkeys
      - bourreau_data:/home/cbrain/data

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - db_net
      - adminer_net
    ports:
      # Bound to localhost only: Adminer gives full DB access
      - "127.0.0.1:8080:8080"

networks:
  # internal: no published ports and no outside access
  db_net:
    internal: true
  # Portal <-> Bourreau, SSH only (stands for the link to the cluster)
  cbrain_net:
  # Only carries Adminer's published port, since db_net cannot
  adminer_net:

volumes:
  db_data:
  portal_ssh:
  bourreau_hostkeys:
  bourreau_data:
  portal_data:
