# Emulated Slurm cluster for CBRAIN development (see docker/slurm/README.md).
# Read by slurmctld, the compute nodes and the Bourreau (the login node),
# all of which mount this directory at /etc/slurm.
#
# Small by design: it tests the whole CBRAIN loop (sbatch, squeue, sacct,
# shared work directories, modules), not real workloads.

ClusterName=cbrain-dev
SlurmctldHost=slurmctld
SlurmUser=slurm
AuthType=auth/munge

StateSaveLocation=/var/spool/slurmctld
SlurmdSpoolDir=/var/spool/slurmd
SlurmctldPidFile=/run/slurmctld.pid
SlurmdPidFile=/run/slurmd.pid
# No mail server in the emulator
MailProg=/bin/true
# No log files: with -D, the daemons log to stderr, seen by 'docker compose logs'

# Containers have no cgroup delegation: track processes the simple way
ProctrackType=proctrack/linuxproc
TaskPlugin=task/none
MpiDefault=none

SchedulerType=sched/backfill
SelectType=select/cons_tres
SelectTypeParameters=CR_Core

# Accounting, for 'sacct' (CBRAIN reads the CPU times of finished jobs)
AccountingStorageType=accounting_storage/slurmdbd
AccountingStorageHost=slurmdbd
JobAcctGatherType=jobacct_gather/linux
JobAcctGatherFrequency=30
JobCompType=jobcomp/none

# Makes 'module load' work in the jobs' non-interactive bash shells
TaskProlog=/etc/slurm/task_prolog.sh

# A node that comes back after a container restart returns to service
ReturnToService=2
# The node sizes below are declared, not detected: accept them on any host
SlurmdParameters=config_overrides

NodeName=c1 CPUs=2 RealMemory=2048 State=UNKNOWN
# MaxTime in minutes: this cluster is for short test jobs
PartitionName=cbrain Nodes=c1 Default=YES MaxTime=60 State=UP
