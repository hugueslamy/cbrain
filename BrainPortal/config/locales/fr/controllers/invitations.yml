---
fr:
  invitations:
    errors:
      no_recipient: Veuillez indiquer au moins une adresse e-mail ou un nom d'utilisateur
    flash:
      added_to_project: Vous avez été ajouté au projet %{name}.
      already_invited: 'Déjà invités : %{logins}'
      already_used: |-
        Cette invitation a déjà été utilisée.
        Veuillez contacter le propriétaire du projet si vous souhaitez être invité de nouveau.
      canceled: L'invitation adressée à %{login} a été annulée.
      no_new_users: Aucun nouvel utilisateur à inviter n'a été trouvé.
      no_permission: Vous n'avez pas la permission d'envoyer des invitations pour ce projet.
      sent:
        one: Votre invitation a été envoyée avec succès à %{count} utilisateur
        other: Votre invitation a été envoyée avec succès à %{count} utilisateurs
      users_not_found: |
        Nous ne pouvons pas inviter le ou les utilisateurs identifiés par : %{specs}.
        Actuellement, les utilisateurs sont reconnus par leur adresse e-mail ou leur nom d'utilisateur.
        Veuillez confirmer auprès de vos collaborateurs l'adresse e-mail ou le nom d'utilisateur qu'ils utilisent dans CBRAIN.
