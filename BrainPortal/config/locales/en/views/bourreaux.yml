      paragraphs:
        persistent_ssh_explanation: When set to 'always', the SSH connections to a data provider's host will persist after the first use. This makes successive data transfers a bit faster because the connection doesn't have to be re-opened every time it is needed. The default is to have this behavior ON ('always') for portals and OFF ('never') for execution servers.
        reverse_service_defaults_html: Some <strong>default values</strong> shown under the input boxes are <em>guesses</em> based on the currently running Portal. These are useful if the portal happens to be the server to connect back to.
        reverse_service_description_html: This is an alternate mechanism to provide the Bourreau with a distinct database and SSH agent connection. For this to work, an SSH-accessible server (provided by hostname, port number and username) must be configured to accept the main CBRAIN portal key, and be visible from the Bourreau. That server must have a SSH agent that provides keys on a UNIX domain socket, and a database connection for CBRAIN. The database connection specification can be provided as either as a full path to a UNIX domain socket, or as <em>localhost:port</em>.
